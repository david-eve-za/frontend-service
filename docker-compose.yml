version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: frontend-service-postgres
    environment:
      POSTGRES_DB: frontend_service
      POSTGRES_USER: frontend_user
      POSTGRES_PASSWORD: frontend_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontend_user -d frontend_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local