server:
  port: 8080

spring:
  application:
    name: frontend-service
  # Carga el archivo .env de la raíz del proyecto como fuente de propiedades
  # (necesario para que NVIDIA_API_KEY esté disponible al arrancar desde
  # terminal; en IDEA puede seguir usándose EnvFile o la variable de entorno).
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    # SQL logging goes to stdout with no level control and adds overhead to
    # every query; the H2 console (/h2-console) and the in-app log viewer
    # cover SQL debugging. Set to true only while tuning queries.
    show-sql: false
    open-in-view: false
    properties:
      # JDBC batching: UUID primary keys are generated client-side, so
      # insert batching applies to every hot write path (chunk split,
      # block save, glossary terms, catalog sync upserts).
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  cache:
    type: caffeine
    # regexPatterns: enabled cleaning patterns read on EVERY text
    #   extraction/save (long-lived, explicitly evicted on CRUD).
    # catalogCounts: novel/volume COUNT(*) for the dashboard (short TTL,
    #   also evicted when a catalog sync run finishes).
    cache-names: regexPatterns,catalogCounts
    caffeine:
      spec: "maximumSize=500,expireAfterWrite=30s"
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    # CACHE_SIZE in KB (default 16384 = 16MB): the H2 file holds ~24MB of
    # data, so a 64MB page cache keeps the whole hot database (catalog +
    # chunk texts) in memory instead of re-reading pages from disk.
    url: jdbc:h2:file:./H2-FrontEnd-Service;CACHE_SIZE=65536
    driverClassName: org.h2.Driver
    username: sa
    password:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    openai:
      api-key: ${NVIDIA_API_KEY}
      # Spring AI 2.x (SDK oficial OpenAI) requiere el /v1 en el base URL;
      # sin él las llamadas van a /chat/completions y NVIDIA responde 404.
      base-url: https://integrate.api.nvidia.com/v1
      chat:
        # Fallback residual: toda llamada real fija su modelo vía la
        # rotación de app.nvidia.models; esto solo aplicaría a una
        # llamada directa al ChatModel sin opciones.
        model: openai/gpt-oss-20b
        # Timeout EXPLÍCITO por petición al ChatModel. Análisis 2026-10-17:
        # - El default implícito de Spring AI (60 s, AbstractOpenAiProperties
        #   /AbstractOpenAiOptions.DEFAULT_TIMEOUT) NO se aplica a las
        #   llamadas chat en 2.0.1 (llamadas reales de 102-133 s lo
        #   demuestran; OpenAiChatModel no construye RequestOptions con él),
        #   así que el tope operativo es el del SDK OpenAI (10 min).
        # - El techo REAL es del SERVIDOR de NVIDIA (~240 s: todos los
        #   fallos cloud se agrupan en ~243 s con "Request failed"), que
        #   ningún timeout de cliente puede levantar.
        # - 5 min (>= techo del servidor) fija la intención, nunca es el
        #   límite operativo hoy y blinda el pipeline ante una futura
        #   versión de Spring AI que empiece a honrar los 60 s implícitos
        #   (mataría llamadas legítimas de 102+ s de golpe).
        options:
          timeout: 5m
    model:
      embedding: none
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gpt-oss:20b

app:
  audio:
    # Voz de Microsoft Edge TTS que sustituye al comando 'say' de macOS.
    # Ejemplos: es-MX-DaliaNeural, es-MX-JorgeNeural, es-ES-ElviraNeural, en-US-EmmaMultilingualNeural
    voice: es-MX-DaliaNeural
    rate: "+0%"
    volume: "+0%"
    pitch: "+0Hz"
    connect-timeout: 10
    receive-timeout: 60
    # Fragmentos de TTS sintetizados en paralelo (virtual threads) por
    # bloque de audio, con este tope suave hacia el endpoint de Edge TTS.
    tts-concurrency: 3
    # Presupuesto TOTAL de la síntesis de un bloque: escala con el número
    # de fragmentos (olas de tts-concurrency × techo connect+receive de
    # cada una) con este suelo mínimo. El cap fijo de 10 min mataba
    # corridas legítimas de libros completos (cientos de fragmentos).
    tts-min-total-timeout-seconds: 600
    # Tope de la mezcla ffmpeg de un bloque: un ffmpeg atascado falla el
    # paso AUDIO en vez de colgar el pipeline para siempre (el libro
    # quedaría en PROCESSING con el guard de reentrancia ocupado).
    merge-timeout-minutes: 15
  nvidia:
    # Pool de modelos con ROTACIÓN AUTOMÁTICA. PRIORIDAD: NVIDIA siempre
    # primero (z-ai/glm-5.3 como primario), y ollama:gpt-oss:20b como
    # ÚLTIMO recurso — SOLO si el proveedor NVIDIA está completamente
    # offline, la rotación cae al modelo local de Ollama para no dejar
    # al pipeline sin traducción. El prefijo "ollama:" enruta la llamada
    # al servidor local (http://localhost:11434), no a la API de NVIDIA.
    models: "openai/gpt-oss-20b"
    max-retries: 3
    # Cuota de la API de NVIDIA en solicitudes por minuto. El pipeline
    # completo (traducción con reintentos/rotación y extracción del
    # glosario) pasa por este limitador: los virtual threads aparcan
    # gratis mientras esperan cupo.
    rate-limit-rpm: 30
    # Estrategia de presupuesto de SALIDA: el límite que corrompe la
    # traducción no es el input (131K de contexto) sino los tokens que el
    # modelo puede RESPONDER (traducción + razonamiento cuentan juntos).
    # El texto se divide en piezas de hasta (max-output-tokens - reserve)
    # * chars-per-token / expansion-factor caracteres para que la
    # respuesta proyectada nunca sature el cupo, cortando SIEMPRE en
    # fronteras de párrafo; si aún así el modelo trunca (finish_reason
    # = length), la pieza se re-divide a la mitad automáticamente.
    max-output-tokens: 8192
    # Margen que se descuenta del cupo para el razonamiento interno del
    # modelo antes de estimar la traducción visible.
    reasoning-reserve-tokens: 1024
    # Heurística conservadora de caracteres por token para el idioma de
    # SALIDA (el español rinde ~3.5; inglés ~4).
    chars-per-token: 3.5
    # La traducción al español expande ~10-15% el texto origen; el
    # presupuesto se calcula con este factor para no quedarse corto.
    translation-expansion-factor: 1.15
    # AUTO-SANADO POR TIEMPO: el servidor de NVIDIA corta las generaciones
    # que superan ~240 s (llegan como "Request failed" a ~243 s). Un
    # intento reintentable que dure al menos este umbral cuenta como
    # "timeout lento"; tras slow-piece-max-failures de ellos, la pieza se
    # re-divide a la mitad (recursivamente, en fronteras de párrafo, el
    # mismo mecanismo que el truncado por finish_reason=length) en vez de
    # quemar ~4 min y una unidad de cuota RPM por cada modelo del pool.
    # Las mitades tardan proporcionalmente menos y convergen bajo el techo
    # (coste: +1 llamada RPM por cada nivel de división).
    slow-piece-threshold-seconds: 240
    slow-piece-max-failures: 2
  ollama:
    # Pool 100% LOCAL para cuando el proveedor elegido (abajo, app.ai.*)
    # sea "ollama" para un caso de uso. hy-mt2 (Tencent) es ESPECIALIZADO
    # en traducción (33 idiomas, fast-thinking: sin razonamiento, todo el
    # tope de salida es traducción visible); gemma4 y gpt-oss son los
    # generalistas creativos. El prefijo "ollama:" enruta a localhost:11434.
    models: "ollama:gpt-oss:20b"
  ai:
    # PROVEEDOR POR CASO DE USO (nvidia | ollama). Son los DEFAULTS al
    # arrancar; la selección real se cambia EN CALIENTE desde la página de
    # Configuración (se persiste en BD y sobrevive reinicios).
    # - nvidia: usa el pool app.nvidia.models (cloud, con fallback local).
    # - ollama: usa SOLO el pool local app.ollama.models.
    translation-provider: nvidia
    story-provider: nvidia
  ai-inspector:
    # Sondas de disponibilidad antes de usar un modelo: timeout de conexión
    # CORTO para que un DNS caído falle en segundos (no cuelgue la
    # rotación), y caché con TTL para no sondear en cada llamada.
    # Las especificaciones reales se leen de los modelos locales de Ollama
    # (spring.ai.ollama.base-url: /api/show expone contexto, parámetros,
    # cuantización y capacidades); NVIDIA no expone specs por modelo.
    probe-timeout-seconds: 5
    probe-cache-ttl-seconds: 60
  nlp:
    model-path: classpath:/model
    models:
      en: opennlp-en-ud-ewt-sentence-1.3-2.5.4.bin
      es: opennlp-es-ud-gsd-sentence-1.3-2.5.4.bin
  processing:
    chunk-size: 3000
    chunk-overlap: 100
    thread-pool:
      core-size: 4
      max-size: 8
      queue-capacity: 100
    # Pipeline orchestration: max attempts per step/chunk and auto-resume
    # of interrupted books on startup.
    max-attempts: 3
    auto-resume: true
  log-persistence:
    # Histórico de logs en BD para análisis a posteriori (tabla log_event,
    # buscable vía GET /api/logs/search). El visor en vivo no cambia.
    enabled: true
    # Nivel mínimo persistido: por debajo solo va al visor en tiempo real.
    min-level: INFO
    # Retención: los eventos más antiguos que estos días se purgan (una
    # vez al día y al arrancar).
    retention-days: 7
  novels:
    # Remote library to sync (mirrors NovelsUpdater.py BASE_URL).
    base-url: "https://server.elscione.com/Officially%20Translated%20Light%20Novels/"
    # Local destination for downloaded novels (relative to the working dir).
    output-dir: ./output
    # Anti-blocking (Tier 3): fewer parallel connections look less bot-like;
    # the shared pacer already bounds the aggregate request rate.
    max-workers: 3
    chunk-size: 65536
    api-timeout-seconds: 30
    download-timeout-seconds: 60
    # Exponential backoff per retry attempt: 16s, 32s, 64s, 128s, 256s.
    # Wide spacing so Cloudflare/origin cooldowns elapse before retrying.
    max-retries: 5
    retry-backoff-seconds: 16
    # Anti-blocking (Tier 1): minimum spacing between ANY two elscione
    # requests (listings + downloads) across all threads, with +/-25% jitter.
    # 0 disables pacing. Honors Retry-After when the server sends it (Tier 2).
    min-request-interval-ms: 2000
    session-ttl-minutes: 30
    # FlareSolverr sidecar (compose.yaml) solves the Cloudflare challenge and
    # provides the cf_clearance cookie + matching user agent. Empty disables it.
    flaresolverr-url: http://localhost:8191
    flaresolverr-timeout-seconds: 60
    # Persistent FlareSolverr session: navigates the target TWICE with the same
    # browser context and merges the cookie jars. The first navigation can
    # solve the Cloudflare challenge AFTER FlareSolverr reads the cookies, so
    # the second one returns the complete jar (cf_clearance included). FlareSolverr
    # alone CANNOT solve Anubis: it returns the challenge page as content before
    # the browser's proof of work completes. Empty disables it (single navigation).
    flaresolverr-session: elscione-bypass
    # Anubis proof-of-work solver (Java-native): probes the origin on session
    # resolution and, when the Anubis interstitial appears, solves the embedded
    # SHA-256 challenge and redeems it via pass-challenge to mint the auth cookie.
    anubis-solve-enabled: true
    # Safety bound: refuse to brute-force difficulties above this many hex zeros.
    anubis-max-difficulty: 24
    # Dynamic session cache (replaces the old static-cf-* env vars): after a
    # verified mint the service stores {userAgent, cookies, obtainedAt} here
    # and reuses it (after a live probe) on restarts and after invalidations,
    # so FlareSolverr is not needed again while the cookies stay valid.
    # Empty disables persistence. Gitignored: contains live cookies.
    session-cache-path: .elscione-session.json
    # Acquisition attempts per resolution: 1st probes the persisted session
    # (if any), further attempts re-mint via FlareSolverr + Anubis. Bounded so
    # the outer retry/backoff of ElscioneApiClient paces the re-mints.
    session-acquisition-attempts: 2
  novels-manager:
    # Catalog sync downloads NOTHING: only titles/volumes/formats metadata.
    auto-sync-enabled: true
    # Full catalog metadata sync when the application boots, so the
    # manager starts fresh without waiting for the 3h cron.
    sync-on-startup: true
    # Every 3 hours (cron; fixed by requirement).
    sync-cron: "0 0 */3 * * *"
    # Directory levels walked below the library root during metadata sync.
    sync-max-depth: 3
    # Anti-ban (Tier 4): process the metadata listings in batches of
    # sync-batch-size requests separated by sync-batch-pause-minutes pauses,
    # so the server sees short bursts with long recovery windows instead of
    # a sustained multi-hour crawl. The pause is instantly cancellable via
    # POST /sync/cancel and is visible in the status as pauseUntil.
    # batch-size <= 0 disables batching (legacy continuous behavior).
    sync-batch-size: 100
    sync-batch-pause-minutes: 10

  crawler:
    # Global defaults for all source crawlers (overridden per-source below)
    default-rate-limit-rpm: 30
    default-timeout-seconds: 30
    default-user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    # FlareSolverr sidecar (shared across crawlers that need it)
    flaresolverr-url: http://localhost:8191
    flaresolverr-timeout-seconds: 60
    # Anubis proof-of-work solver
    anubis-solve-enabled: true
    anubis-max-difficulty: 24
    # Session cache (shared)
    session-cache-path: .crawler-sessions.json
    # Per-source configuration (merged with defaults)
    sources:
      elscione:
        base-url: "https://server.elscione.com/Officially%20Translated%20Light%20Novels/"
        rate-limit-rpm: 20
        cloudflare-bypass: true
        enabled: true
        tags: ["official", "spanish", "light-novel"]
      novelasligeras:
        base-url: "https://novelasligeras.net/"
        rate-limit-rpm: 30
        cloudflare-bypass: true
        enabled: true
        tags: ["spanish", "light-novel", "web"]
      novelaenespanol:
        base-url: "https://novelaenespanol.com/"
        rate-limit-rpm: 60
        cloudflare-bypass: true
        enabled: true
        tags: ["spanish", "light-novel", "wordpress"]
      novelasligera_com:
        base-url: "https://novelasligera.com/"
        rate-limit-rpm: 30
        cloudflare-bypass: true
        enabled: true
        tags: ["spanish", "light-novel", "elementor"]
      skynovels:
        base-url: "https://skynovels.net/"
        rate-limit-rpm: 30
        cloudflare-bypass: true
        enabled: true
        tags: ["spanish", "light-novel"]
      domentranslations:
        base-url: "https://domentranslations.wordpress.com/"
        rate-limit-rpm: 60
        cloudflare-bypass: true
        enabled: true
        tags: ["spanish", "light-novel", "wordpress", "translation"]
      novelupdates:
        base-url: "https://www.novelupdates.com/"
        rate-limit-rpm: 120
        cloudflare-bypass: false
        enabled: true
        tags: ["multi", "directory", "api"]
      foxaholic:
        base-url: "https://foxaholic.com/"
        rate-limit-rpm: 30
        cloudflare-bypass: false
        enabled: true
        tags: ["multi", "translation", "web"]

logging:
  level:
    root: INFO
    com.glez.frontendservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{bookId:-}/%X{traceId:-}/%X{step:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{bookId:-}/%X{traceId:-}/%X{step:-}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/${spring.application.name}.log

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    doc-expansion: list
    display-request-duration: true
  packages-to-scan: com.glez.frontendservice.controllers
  paths-to-match: /api/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json