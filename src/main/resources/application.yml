server:
  port: 9000

spring:
  application:
    name: frontend-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./H2-FrontEnd-Service
    driverClassName: org.h2.Driver
    username: sa
    password: 
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gpt-oss:20b
      # IMPORTANT: Ensure Ollama server is running and the model 'gpt-oss:20b' is pulled.
      # You can start Ollama and pull the model using:
      # ollama run gpt-oss:20b
    google:
      genai:
        api-key: ${GEMINI_API_KEY:AIzaSyB7LHLlJgvw3_xQRnk7-iDjpBZIpk0BhFg} # Environment variable for security. Set GEMINI_API_KEY.
        chat:
          options:
            model: gemma-3-27b-it

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/${spring.application.name}.log